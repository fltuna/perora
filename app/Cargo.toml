[package]
name = "perora-app"
version.workspace = true
description = "Perora on GPUI: the application (tray, shortcut, windows)"
license = "MIT"
edition = "2024"
publish = false
build = "build.rs"

# `perora.exe`, as the Tauri version's was: the installer, the updates and the registry (the Run key,
# "Open with Perora", the uninstaller's `MainBinaryName`) all know it by that name.
[[bin]]
name = "perora"
path = "src/main.rs"

[dependencies]
# What is on the clipboard, to open in the editor: a file copied in the file manager, or an image.
arboard = "3"
async-channel = "2"
global-hotkey = "0.8"
gpui = { workspace = true }
gpui_platform = { workspace = true }
# GPUI's pictures are of its frames (`RenderImage`).
image = { version = "0.25", default-features = false }
raw-window-handle = "0.6"
perora-core = { path = "../crates/core" }
perora-editor = { path = "../crates/editor" }
perora-ui = { path = "../crates/ui" }
# Without its defaults: they bring GTK for Linux (libappindicator), which Windows does not use and
# whose pins clash with GPUI's build tools in the lock file.
tray-icon = { version = "0.25", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
# tests/texts.rs reads the reference language file for the beginnings of its keys.
serde_json = "1"
