# Keeps Perora's fork of Zed (fltuna/zed) up to date: its `main` follows Zed's, and Zed's main is
# merged into `perora`, the branch with Perora's changes to GPUI. Perora itself names the commit of
# `perora` it builds with (a `rev` in Cargo.toml), and moves it by hand after trying it.
#
# It runs here rather than in the fork: a fork runs scheduled workflows only from its default
# branch, and turning Actions on there would start every one of Zed's own workflows too.
name: Zed fork

on:
  schedule:
    - cron: "0 3 * * 1" # Mondays, 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  merge:
    # Only in the private repository, which holds the key to the fork; the public one has none.
    if: github.event.repository.private
    runs-on: ubuntu-latest
    steps:
      - name: The key to the fork
        env:
          KEY: ${{ secrets.ZED_FORK_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/zed_fork
          chmod 600 ~/.ssh/zed_fork
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts

      - name: Follow Zed's main, and merge it into perora
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/zed_fork -o IdentitiesOnly=yes
        run: |
          git clone --filter=blob:none --branch perora git@github.com:fltuna/zed.git zed
          cd zed
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/zed-industries/zed.git
          git fetch --filter=blob:none upstream main
          # The fork's main is Zed's, as it is: moved forward only, never forced.
          git push origin refs/remotes/upstream/main:refs/heads/main
          # A conflict stops here and fails the run: that is the signal to merge by hand.
          git merge --no-edit upstream/main
          git push origin perora
