[package]
name = "perora-core"
version.workspace = true
description = "What Perora does, without its window: capturing the screen, and the geometry around it"
license = "MIT"
edition = "2024"

[dependencies]
base64 = "0.22"
dirs = "7"
getrandom = "0.3"
jpeg-encoder = "0.7"
# Checks that an update is one Perora's key signed (what Tauri's updater checked it with).
minisign-verify = "0.3"
png = "0.18"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
ureq = { version = "3", features = ["json"] }
url = "2"
webp = { version = "0.3", default-features = false }

[target.'cfg(windows)'.dependencies]
# The points DirectWrite gives the outlines of letters in (`Vector2`).
windows-numerics = "0.3"
# What `#[implement]` (a COM object made in Rust: the sink of the outlines) is written against.
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Media_Multimedia",
    "Win32_Security_Cryptography",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
